
name: Validate Repository

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON
        run: python -m json.tool index.json

      - name: Validate source index
        run: |
          python - <<'PY'
          import json
          import sys

          with open("index.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              sys.exit("ERROR: index.json must be an array")

          for i, item in enumerate(data):
              if not isinstance(item, dict):
                  sys.exit(f"ERROR: Entry {i} must be an object")

          print(f"Validation passed: {len(data)} source entries")
          PY
